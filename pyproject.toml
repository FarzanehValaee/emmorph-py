[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyemmorph"
version = "0.1.0.dev0"
description = "Python port of the emMorph Hungarian morphological analyser"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Farzaneh Velaeishekan", email = "farzaneh.valaee79@gmail.com"},
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.7",
    "black>=23.12",
    "isort>=5.13",
]

[project.urls]
"Source" = "https://github.com/FarzanehValaee/emmorph-py"
"Original emMorph" = "https://github.com/nytud/emmorph"

[tool.setuptools.packages.find]
include = ["pyemmorph*"]
exclude = ["tests*", "harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # too strict for now; will tighten later
